name: Deploy

# Deploys the PWA to Cloudflare Pages production after CI passes on main.
# The notification worker (`worker/`) is deployed by hand (`pnpm deploy:push`);
# it is the trust boundary and is never deployed from CI.
# Setup (secrets and variables): see "Deploy and test on the iPhone" in README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One production deploy at a time; a newer push waits instead of racing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pages:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # workflow_run checks out the default branch tip by default; deploy the
      # exact commit CI verified instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without these the build succeeds but push silently does nothing.
      - name: Check build variables
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_API_URL: ${{ vars.VITE_PUSH_API_URL }}
        run: |
          missing=0
          for name in VITE_VAPID_PUBLIC_KEY VITE_PUSH_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo variable $name is not set"
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_API_URL: ${{ vars.VITE_PUSH_API_URL }}
      # Uses the wrangler pinned in pnpm-lock.yaml (worker devDependency).
      # --branch main targets production; otherwise Pages makes a preview.
      - run: >-
          pnpm --filter worker exec wrangler pages deploy ../dist
          --project-name workout-tracker
          --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
