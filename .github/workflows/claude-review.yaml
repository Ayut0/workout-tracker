name: Claude Code Review

# Advisory PR review on `@claude review`. The logic lives in
# Ayut0/marketplace-for-ai-agent's reusable workflow; this caller only gates who can
# trigger it. One-time setup: install https://github.com/apps/claude and add the
# CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`).
# issue_comment workflows run from the default branch only.

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      id-token: write
    uses: Ayut0/marketplace-for-ai-agent/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
